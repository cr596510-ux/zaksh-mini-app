<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#080b14">

<title>ZAKSH Mining</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #080b14;
  --panel: #101522;
  --panel2: #151b2a;
  --border: #252d40;
  --text: #ffffff;
  --muted: #8993aa;
  --purple: #8b5cf6;
  --purple-dark: #6d3df5;
  --green: #22c55e;
  --red: #ef4444;
}

html,
body {
  min-height: 100%;
  background: var(--bg);
}

body {
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  padding-bottom: 90px;
}

button {
  font: inherit;
}

button:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 2px;
}

.app {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 16px;
}

/* TOP BAR */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 900;
}

.logo-mark {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(
    145deg,
    #9b6cff,
    #4c1d95
  );
  box-shadow:
    0 8px 28px rgba(139, 92, 246, .25);
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  border-radius: 30px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #f59e0b;
}

/* PAGES */

.page {
  display: none;
}

.page.active {
  display: block;
}

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 4px 2px 16px;
}

.page-title {
  font-size: 25px;
  font-weight: 900;
}

.refresh {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: var(--panel);
  color: #fff;
  border: 1px solid var(--border);
  cursor: pointer;
}

/* HERO */

.hero {
  position: relative;
  overflow: hidden;
  padding: 22px;
  margin-bottom: 14px;
  border-radius: 24px;
  border: 1px solid var(--border);

  background:
    radial-gradient(
      circle at 90% 0%,
      rgba(139, 92, 246, .25),
      transparent 36%
    ),
    linear-gradient(
      145deg,
      #151b2b,
      #0e1320
    );
}

.hero-label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 8px;
}

.hero-balance {
  font-size: 40px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -1px;
}

.token {
  color: #aab4c8;
  font-size: 13px;
  margin-top: 6px;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}

.stat {
  padding: 13px;
  border-radius: 14px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.07);
}

.stat-label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 5px;
}

.stat-value {
  font-size: 15px;
  font-weight: 800;
}

/* CARDS */

.card {
  padding: 18px;
  margin-bottom: 14px;
  border-radius: 20px;
  background: var(--panel);
  border: 1px solid var(--border);
}

.mining-card {
  text-align: center;
  padding: 24px 18px;
}

.mining-orb {
  width: 96px;
  height: 96px;
  display: grid;
  place-items: center;
  margin: 0 auto 16px;
  border-radius: 50%;
  font-size: 30px;

  background:
    radial-gradient(
      circle,
      #b9a0ff 0 12%,
      #7c3aed 13% 37%,
      #32116b 38% 65%,
      #17132c 66%
    );

  box-shadow:
    0 0 0 8px rgba(139,92,246,.08),
    0 0 45px rgba(139,92,246,.25);
}

.mining-title {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 7px;
}

.mining-subtitle {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.primary {
  width: 100%;
  min-height: 48px;
  border: 0;
  border-radius: 14px;
  color: #fff;
  font-weight: 800;
  cursor: pointer;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple-dark)
    );

  box-shadow:
    0 10px 25px rgba(109,61,245,.22);
}

.primary:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.quick {
  min-height: 104px;
  padding: 16px;
  text-align: left;
  color: #fff;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  cursor: pointer;
}

.quick-icon {
  font-size: 22px;
  margin-bottom: 12px;
}

.quick-title {
  display: block;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 5px;
}

.quick-text {
  display: block;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

/* MESSAGE */

.message {
  display: none;
  padding: 12px 14px;
  margin-bottom: 13px;
  border-radius: 13px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: #cbd3e1;
  font-size: 12px;
  line-height: 1.5;
}

.message.show {
  display: block;
}

.message.error {
  color: #fecaca;
  border-color: rgba(239,68,68,.45);
}

.loading {
  padding: 25px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

</style>
</head>

<body>

<main class="app">

<header class="topbar">

  <div class="logo">

    <div class="logo-mark">
      Z
    </div>

    <span>
      ZAKSH
    </span>

  </div>

  <div class="status">

    <span
      class="status-dot"
      id="statusDot"
    ></span>

    <span id="connectionStatus">
      Connecting
    </span>

  </div>

</header>

<div
  id="message"
  class="message"
></div>
